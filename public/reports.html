<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — MbiInventra RCM Academy</title><link rel="stylesheet" href="/css/app.css"></head>
<body><div class="shell"><aside class="side" id="sidebar"></aside><main class="main"><div class="page" style="max-width:1180px">
  <div class="phead"><div>
    <div class="eyebrow2">MbiInventra RCM Academy</div><h1>Reports &amp; Analytics</h1>
    <p class="psub">Revenue cycle performance and training progress — one view.</p>
  </div><span class="bdg b-teal" style="font-size:12px">Student Report</span></div>

  <h3 style="margin:4px 0 14px">💼 RCM Performance</h3>
  <div class="kpi-strip" id="kpisRcm" style="grid-template-columns:repeat(4,1fr)"></div>

  <h3 style="margin:22px 0 14px">🎓 Training Performance</h3>
  <div class="kpi-strip" id="kpisTr" style="grid-template-columns:repeat(4,1fr)"></div>

  <div class="panel"><div class="prow"><h3 style="margin:0">Recent Training Attempts</h3></div>
    <div class="twrap"><table><thead><tr>
      <th>Case</th><th>Title</th><th>Score</th><th>Date</th>
    </tr></thead><tbody id="rows"></tbody></table></div>
    <div class="empty" id="empty" style="display:none">No attempts yet — start training. 🎯</div>
  </div>

  <div class="panel"><div class="prow"><h3 style="margin:0">Lab Bests</h3></div>
    <div class="twrap"><table><thead><tr><th>Lab</th><th>Best Score</th><th>Runs</th></tr></thead>
    <tbody id="labrows"></tbody></table></div>
  </div>
</div></main></div>
<script src="/js/app.js"></script>
<script>
const LABN = { scrubber: 'Claim Scrubber', denials: 'Denial Crime-Scene', sprints: 'Coding Sprints', quiz: 'Quiz Arena' };
async function load() {
  const u = await requireLogin(); if (!u) return;
  shell('reports', u);
  if (!guardFeature(u, 'reports', 'Reports')) return;
  const d = await api('/api/rcm/reports');
  const r = d.rcm, t = d.training;
  document.getElementById('kpisRcm').innerHTML = [
    ['Total billed', money(r.totalBilled), `${r.totalClaims} claims`],
    ['Collected', money(r.collected), 'Payer payments'],
    ['Denial rate', r.denialRate + '%', 'Denied / appealed'],
    ['Clean claim rate', r.cleanClaimRate + '%', 'Passed validation'],
  ].map(([l, v, s]) => `<div class="kpi"><span>${l}</span><b>${v}</b><div class="sub">${s}</div></div>`).join('');
  document.getElementById('kpisTr').innerHTML = [
    ['Attempts', t.attempts, 'Finished cases'],
    ['Average score', t.avgScore + '%', 'Across attempts'],
    ['Best score', t.bestScore + '%', 'Highest recorded'],
    ['Open A/R', r.openAR, `${r.avgDaysAR} avg days`],
  ].map(([l, v, s]) => `<div class="kpi"><span>${l}</span><b>${v}</b><div class="sub">${s}</div></div>`).join('');
  document.getElementById('rows').innerHTML = d.recent.map(a => `<tr>
    <td><b>${esc(a.code)}</b></td><td>${esc(a.title)}</td>
    <td><b>${Math.round(100 * a.score / Math.max(1, a.max))}%</b> <span style="color:#64748b">(${a.score}/${a.max})</span></td>
    <td>${esc((a.when || '').slice(0, 10))}</td></tr>`).join('');
  document.getElementById('empty').style.display = d.recent.length ? 'none' : 'block';
  document.getElementById('labrows').innerHTML = t.labs.map(l => `<tr>
    <td>${esc(LABN[l.lab] || l.lab)}</td><td><b>${l.best}</b></td><td>${l.runs}</td></tr>`).join('')
    || `<tr><td colspan="3" class="empty">No lab runs yet.</td></tr>`;
}
load();
</script></body></html>
