<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Panel — MbiInventra RCM Academy</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div><h1>👑 Owner Panel</h1><p>Your academy's performance at a glance.</p></div>
      <span class="badge-fict">TRAINING MODE · fictional data</span>
    </div>
    <div class="cards" id="stats"></div>
    <div class="panel" id="syshealth"></div>
    <div class="grid2">
      <div class="panel"><h3>📊 Completions per case</h3><div id="chart"></div></div>
      <div class="panel"><h3>🕘 Recent attempts (all students)</h3><div id="attempts"></div></div>
    </div>
    <div class="panel"><h3>🧬 Lab activity (all students)</h3><div id="labruns"></div></div>
    <div class="panel"><h3>📚 Cases</h3><div id="cases"></div></div>
    <div class="grid2">
      <div class="panel">
        <h3>➕ Create account</h3>
        <div class="alert err" id="err"></div>
        <div class="field"><label>Full name</label><input class="input" id="nName"></div>
        <div class="field"><label>Email</label><input class="input" id="nEmail" type="email"></div>
        <div class="field"><label>Password (6+ chars)</label><input class="input" id="nPass" type="password"></div>
        <div class="field"><label>Role</label><select class="input" id="nRole">
          <option value="student">Student</option><option value="instructor">Instructor</option><option value="admin">Admin</option>
        </select></div>
        <button class="btn btn-teal" id="create">Create account</button>
        <p style="font-size:12.5px;color:#8a97ad;margin-top:12px">No public registration exists — every account is created here.</p>
      </div>
      <div class="panel"><h3>👥 Accounts</h3><div id="users"></div></div>
    </div>
  </main>
</div>
<script src="/js/app.js"></script>
<script>
async function loadUsers() {
  const { users } = await api('/api/admin/users');
  document.getElementById('users').innerHTML = `
    <table><tr><th>Name</th><th>Role</th><th></th></tr>
    ${users.map(x => `<tr><td>${esc(x.name)}<br><span style="font-size:12px;color:#8a97ad">${esc(x.email)}</span></td>
      <td><span class="pill ${x.role === 'admin' ? 'p-advanced' : 'p-beginner'}">${esc(x.role)}</span></td>
      <td style="white-space:nowrap"><button class="btn btn-teal btn-sm" onclick="manage(${x.id})">Manage</button>
      <button class="btn btn-line btn-sm" onclick="del(${x.id})">Delete</button></td></tr>`).join('')}
    </table>`;
}
// ---- per-student control panel (modal) ----
async function manage(id) {
  const d = await api('/api/admin/users/' + id);
  const { user: u, stats, attempts, labs, rcm } = d;
  const { features } = await api('/api/admin/features');
  const off = new Set(d.features.filter(f => !f.enabled).map(f => f.feature));
  const labName = { scrubber: '🧹 Scrubber', denial: '🔍 Denial Lab', 'quiz-timed': '⏱️ Timed Quiz',
    'quiz-weakest': '🎯 Weakest', 'quiz-missed': '🔁 Missed Qs', 'quiz-mix': '🎲 Mix Quiz', 'quiz-sprint': '⚡ Sprint' };
  openModal(`👤 ${u.name}`, `
    <div style="font-size:13px;color:#8a97ad;margin-bottom:12px">${esc(u.email)} · <b>${esc(u.role)}</b><br>
    Created: ${esc((u.created_at || '').slice(0, 10))} · Last login: ${esc((u.last_login || 'never').slice(0, 16).replace('T', ' '))}</div>
    <div class="cards" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px">
      <div class="card stat"><span>Cases done</span><b>${stats.done}/${stats.n}</b></div>
      <div class="card stat"><span>Avg score</span><b>${Math.round(stats.acc)}%</b></div>
      <div class="card stat"><span>Lab runs</span><b>${labs.length}</b></div>
      <div class="card stat"><span>Claims</span><b>${rcm.claims}</b><div class="sub">${rcm.paid} paid · ${rcm.denied} denied</div></div>
    </div>
    <h4 style="margin:12px 0 8px">🔧 Module access <span style="font-weight:400;font-size:12px;color:#8a97ad">(ON/OFF per student)</span></h4>
    <div id="featToggles">${features.map(f => `
      <label class="feat-row"><span><b>${f.icon} ${esc(f.label)}</b><br><span style="font-size:12px;color:#8a97ad">${esc(f.desc)}</span></span>
      <span class="switch"><input type="checkbox" data-feat="${f.key}" ${off.has(f.key) ? '' : 'checked'}><span class="sl"></span></span></label>`).join('')}
    </div>
    <h4 style="margin:14px 0 8px">📝 Case attempts</h4>
    ${attempts.length ? `<table><tr><th>Case</th><th>Score</th><th>Status</th><th>Date</th></tr>
      ${attempts.map(a => `<tr><td><b>${esc(a.code)}</b></td><td><b>${a.score}/${a.max_score}</b></td>
      <td><span class="pill ${a.status === 'completed' ? 'p-beginner' : 'p-prog'}">${esc(a.status)}</span></td>
      <td>${esc((a.completed_at || a.started_at || '').slice(0, 10))}</td></tr>`).join('')}</table>`
      : '<div class="empty">No attempts yet.</div>'}
    <h4 style="margin:14px 0 8px">🧪 Lab runs</h4>
    ${labs.length ? `<table><tr><th>Lab</th><th>Score</th><th>Date</th></tr>
      ${labs.map(r => `<tr><td>${esc(labName[r.lab_key] || r.lab_key)}</td><td><b>${r.score}/${r.max_score}</b></td>
      <td>${esc((r.created_at || '').slice(0, 16).replace('T', ' '))}</td></tr>`).join('')}</table>`
      : '<div class="empty">No lab runs yet.</div>'}
    <h4 style="margin:14px 0 8px">🔑 Reset password</h4>
    <div style="display:flex;gap:8px"><input class="input" id="mPw" type="text" placeholder="New password (6+ chars)" style="flex:1">
    <button class="btn btn-teal btn-sm" onclick="resetPw(${u.id})">Reset</button></div>
    <div style="margin-top:14px"><button class="btn btn-line btn-sm" style="color:#d33;border-color:#d33" onclick="closeModal();del(${u.id})">🗑️ Delete this account</button></div>
    <style>
      .feat-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px solid rgba(148,163,184,.18);border-radius:10px;margin-bottom:8px;cursor:pointer}
      .feat-row:hover{border-color:#0e9f8a}
      .switch{position:relative;display:inline-block;width:46px;height:26px;flex:none}
      .switch input{opacity:0;width:0;height:0}
      .switch .sl{position:absolute;inset:0;background:#94a3b8;border-radius:999px;transition:.2s;cursor:pointer}
      .switch .sl:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
      .switch input:checked + .sl{background:#0e9f8a}
      .switch input:checked + .sl:before{transform:translateX(20px)}
    </style>`,
    () => {
      document.querySelectorAll('#featToggles input[data-feat]').forEach(cb => {
        cb.onchange = async () => {
          const body = { features: { [cb.dataset.feat]: cb.checked } };
          try { await api('/api/admin/users/' + id + '/features', { method: 'POST', body }); }
          catch (e) { alert(e.message); cb.checked = !cb.checked; }
        };
      });
    });
}
async function resetPw(id) {
  const pw = document.getElementById('mPw').value;
  if (!pw || pw.length < 6) return alert('Password must be 6+ characters.');
  try { await api('/api/admin/users/' + id + '/password', { method: 'POST', body: { password: pw } }); alert('Password updated.'); }
  catch (e) { alert(e.message); }
}
async function del(id) {
  if (!confirm('Delete this account and all its attempts?')) return;
  try { await api('/api/admin/users/' + id, { method: 'DELETE' }); boot(); }
  catch (e) { alert(e.message); }
}
async function boot() {
  try {
    const o = await api('/api/admin/overview');
    const avg = o.attempts ? '' : '';
    document.getElementById('stats').innerHTML = `
      <div class="card stat"><span>Total accounts</span><b>${o.users}</b></div>
      <div class="card stat"><span>Students</span><b>${o.students}</b></div>
      <div class="card stat"><span>Training cases</span><b>${o.cases}</b><div class="sub">${o.questions} questions</div></div>
      <div class="card stat"><span>Total attempts</span><b>${o.attempts}</b></div>`;
    // ---- system health: DB engine, data location, config safety ----
    try {
      const d = await api('/api/admin/diagnostics');
      const envRow = (k, v) => `<span class="pill ${v ? 'p-beginner' : 'p-advanced'}">${k}: ${v ? 'set' : 'MISSING'}</span>`;
      const warnHtml = d.warnings.length
        ? `<div class="alert err" style="margin:10px 0">${d.warnings.map(w => esc(w)).join('<br>')}</div>` : '';
      const srcHtml = d.migrationSources.length
        ? `<div style="margin-top:8px;font-size:13px;color:#8a97ad">Other SQLite files found: ${d.migrationSources.map(s => `<b>${esc(s.file)}</b> (${s.students} students)`).join(', ')}</div>` : '';
      const sqliteLine = d.sqlite.active
        ? `<div style="margin-top:8px;font-size:13.5px">📁 <b>${esc(d.sqlite.file)}</b> ${d.sqlite.exists ? `· ${d.sqlite.sizeKB} KB · ${d.sqlite.students} students` : '<b style="color:#d33">· FILE NOT FOUND</b>'}</div>`
        : `<div style="margin-top:8px;font-size:13.5px">📁 SQLite not active (running on MySQL)</div>`;
      document.getElementById('syshealth').innerHTML = `
        <h3>🖥️ System health</h3>
        <div style="font-size:14px;margin:6px 0">Database engine: <b>${esc(d.engine.toUpperCase())}</b> · Accounts in DB: <b>${d.dbUsers}</b> (${d.dbStudents} students)</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">
          ${envRow('DATA_DIR', d.env.DATA_DIR)}${envRow('DB_ENGINE', d.env.DB_ENGINE)}${envRow('DB_HOST', d.env.DB_HOST)}
          ${envRow('DB_USER', d.env.DB_USER)}${envRow('DB_PASS', d.env.DB_PASS)}${envRow('DB_NAME', d.env.DB_NAME)}
          ${envRow('SESSION_SECRET', d.env.SESSION_SECRET)}${envRow('ADMIN_PASS', d.env.ADMIN_PASS)}
        </div>
        ${warnHtml}${sqliteLine}${srcHtml}`;
    } catch (e) { document.getElementById('syshealth').innerHTML = `<h3>🖥️ System health</h3><div class="empty">${esc(e.message)}</div>`; }
    const { cases } = await api('/api/admin/cases');
    const mx = Math.max(1, ...cases.map(c => c.done));
    document.getElementById('chart').innerHTML = cases.map(c => `
      <div class="bar-row"><div class="bl">${esc(c.code)}</div>
        <div class="bt"><i style="width:${Math.round(100 * c.done / mx)}%"></i></div>
        <div class="bv">${c.done}</div></div>`).join('');
    document.getElementById('cases').innerHTML = `
      <table><tr><th>Case</th><th>Level</th><th>Questions</th><th>Completions</th></tr>
      ${cases.map(c => `<tr><td><b>${esc(c.code)}</b> · ${esc(c.title)}</td>
        <td><span class="pill p-${c.difficulty.toLowerCase()}">${esc(c.difficulty)}</span></td>
        <td>${c.qcount}</td><td><b>${c.done}</b></td></tr>`).join('')}</table>`;
    const { attempts } = await api('/api/admin/attempts');
    document.getElementById('attempts').innerHTML = attempts.length ? `
      <table><tr><th>Student</th><th>Case</th><th>Score</th><th>Date</th></tr>
      ${attempts.map(a => `<tr><td>${esc(a.student)}</td><td>${esc(a.code)}</td>
        <td><b>${a.score}/${a.max_score}</b> ${a.status === 'completed' ? '' : '<span class="pill p-prog">' + esc(a.status) + '</span>'}</td>
        <td>${esc((a.completed_at || a.started_at || '').slice(0, 10))}</td></tr>`).join('')}</table>`
      : `<div class="empty">No attempts yet.</div>`;
    const { runs } = await api('/api/admin/lab-runs');
    const labName = { scrubber: '🧹 Scrubber', denial: '🔍 Denial Lab', 'quiz-timed': '⏱️ Timed Quiz',
      'quiz-weakest': '🎯 Weakest', 'quiz-missed': '🔁 Missed Qs', 'quiz-mix': '🎲 Mix Quiz', 'quiz-sprint': '⚡ Sprint' };
    document.getElementById('labruns').innerHTML = runs.length ? `
      <table><tr><th>Student</th><th>Lab</th><th>Score</th><th>Date</th></tr>
      ${runs.map(r => `<tr><td>${esc(r.uname)}</td><td>${esc(labName[r.lab_key] || r.lab_key)}</td>
        <td><b>${r.score}/${r.max_score}</b></td>
        <td>${esc((r.created_at || '').slice(0, 16).replace('T', ' '))}</td></tr>`).join('')}</table>`
      : `<div class="empty">No lab runs yet.</div>`;
    await loadUsers();
  } catch (e) {
    document.querySelector('.main').innerHTML = `<div class="empty" style="margin-top:80px">
      <h2>403 — Owner access required</h2><p>${esc(e.message)}</p><p><a href="/login" style="color:#0e9f8a">← Login</a></p></div>`;
  }
}
(async () => {
  const u = await currentUser();
  if (!u) { location.href = '/owner'; return; }
  adminShell('owner', u); // owner gets its own admin sidebar, not the student one
  document.getElementById('create').onclick = async () => {
    const err = document.getElementById('err');
    err.classList.remove('err'); err.textContent = '';
    try {
      await api('/api/admin/users', { method: 'POST', body: {
        name: document.getElementById('nName').value,
        email: document.getElementById('nEmail').value,
        password: document.getElementById('nPass').value,
        role: document.getElementById('nRole').value } });
      ['nName', 'nEmail', 'nPass'].forEach(id => document.getElementById(id).value = '');
      boot();
    } catch (e) { err.textContent = e.message; err.classList.add('err'); }
  };
  boot();
})();
</script>
</body>
</html>
