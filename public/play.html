<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Case — MbiInventra RCM Academy</title>
<link rel="stylesheet" href="/css/app.css">
<style>
/* quiz mode (untouched) */
.grail{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.gstep-dot{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:#f1f5f9;font-size:13px;font-weight:600;color:#64748b;border:2px solid transparent}
.gstep-dot .n{width:24px;height:24px;border-radius:50%;background:#cbd5e1;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.gstep-dot.done{background:#e6f7f3;color:#0e9f8a}.gstep-dot.done .n{background:#0e9f8a}
.gstep-dot.cur{background:#fff;color:#0f2743;border-color:#0e9f8a;box-shadow:0 2px 12px rgba(14,159,138,.15)}
.gstep-dot.cur .n{background:#0e9f8a}
.gcard{background:#fff;border-radius:16px;padding:28px;box-shadow:0 4px 24px rgba(15,39,67,.07);max-width:760px}
.gcard h2{margin:0 0 6px;font-size:22px;color:#0f2743}
.gcard .gk{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#0e9f8a;margin-bottom:8px}
.gcard .gd{color:#5b6b85;line-height:1.6;margin:0 0 18px}
.gpick{display:grid;gap:10px;max-height:320px;overflow:auto;margin-bottom:16px}
.gpick button{text-align:left;padding:12px 14px;border:2px solid #e2e8f0;border-radius:10px;background:#fff;cursor:pointer;font-size:14px}
.gpick button:hover{border-color:#0e9f8a}
.gpick button.sel{border-color:#0e9f8a;background:#e6f7f3}
.gform{display:grid;gap:12px;margin-bottom:16px}
.gform label{font-size:13px;font-weight:600;color:#0f2743}
.gform input,.gform textarea{padding:10px 12px;border:2px solid #e2e8f0;border-radius:10px;font-size:14px;width:100%;box-sizing:border-box}
.gform input:focus,.gform textarea:focus{border-color:#0e9f8a;outline:none}
.gpoints{display:inline-block;background:#fef3c7;color:#92400e;font-weight:700;font-size:13px;padding:4px 12px;border-radius:20px;margin-bottom:12px}
.gtoast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f2743;color:#fff;padding:12px 24px;border-radius:12px;font-weight:600;z-index:99;animation:gpop .3s ease}
@keyframes gpop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.gdone{text-align:center;padding:40px 20px}
.gdone .ring{width:110px;height:110px;margin:0 auto 18px}
@media(max-width:640px){.gcard{padding:18px}.grail{overflow-x:auto;flex-wrap:nowrap}}
/* ===== REAL-SOFTWARE CASE PLAYER ===== */
.player{max-width:860px;margin:0 auto}
.rc-head{background:linear-gradient(120deg,#0f2743,#143a5e 70%,#0e6f62);border-radius:18px;padding:26px 30px;color:#fff;
  margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  box-shadow:0 8px 28px rgba(15,39,67,.22);position:relative;overflow:hidden}
.rc-head::before{content:"";position:absolute;top:-60px;right:-30px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(52,211,189,.25),transparent 70%)}
.rc-kicker{font-size:11px;font-weight:800;letter-spacing:1.6px;color:#34d3bd;text-transform:uppercase;margin-bottom:8px;position:relative}
.rc-head h1{margin:0 0 8px;font-size:24px;position:relative}
.rc-head p{margin:0;color:#b9d4e8;font-size:13.5px;max-width:560px;position:relative}
.rc-head .pill{flex:none;position:relative}
.rc-card{background:#fff;border-radius:16px;padding:22px 24px;box-shadow:0 2px 14px rgba(15,39,67,.06);
  margin-bottom:16px;border:1px solid #eef2f7;animation:rcIn .35s ease backwards}
@keyframes rcIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rc-card h3{margin:0 0 14px;font-size:16px;color:#0f2743;display:flex;align-items:center;gap:10px}
.rc-n{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#0e9f8a,#34d3bd);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:none;
  box-shadow:0 3px 10px rgba(14,159,138,.35)}
.rc-sub{font-size:13px;color:#64748b;margin:-6px 0 14px;line-height:1.55}
.rc-steps{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.rc-steps li{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:#334155;background:#f8fafc;
  border-radius:10px;padding:10px 14px}
.rc-steps li b{color:#0e9f8a;flex:none}
.rc-tile{background:#f0fdfa;border:1px solid rgba(14,159,138,.25);border-radius:12px;padding:12px 16px;margin-top:12px}
.rc-271{border:1px solid #e2e8f0;border-radius:12px;overflow:hidden}
.rc-271h{background:#0f2743;color:#fff;padding:12px 16px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.rc-271 .kv-card{border-radius:0}
.rc-prev{margin-top:14px}
.rc-foot{border:2px dashed rgba(14,159,138,.35);background:#f8fdfc}
.rule-row{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:13.5px}
.rule-row.ok{background:#f0fdf4;border:1px solid #bbf7d0}
.rule-row.bad{background:#fef2f2;border:1px solid #fecaca}
.rule-row .rr-ic{font-size:16px;flex:none}
.quiz-opts{display:grid;gap:10px}
.quiz-opts .opt{text-align:left;padding:13px 16px;border:2px solid #e2e8f0;border-radius:12px;background:#fff;
  cursor:pointer;font-size:14px;transition:all .15s;color:#0f2743;width:100%}
.quiz-opts .opt:hover{border-color:#0e9f8a}
.quiz-opts .opt.sel{border-color:#0e9f8a;background:#e6f7f3;box-shadow:0 2px 10px rgba(14,159,138,.12)}
.quiz-opts .opt b{color:#0e9f8a;margin-right:6px}
.kv-card{background:#f8fafc;border-radius:12px;padding:6px 14px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eef2f7;font-size:13px;gap:12px}
.kv:last-child{border:none}
.kv span{color:#64748b}
.feedback{display:none;padding:13px 17px;border-radius:12px;font-size:14px;line-height:1.5}
.feedback.show{display:block}
.feedback.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d}
.feedback.no{background:#fef2f2;border:1px solid #fecaca;color:#dc2626}
.fld{margin-bottom:12px}.fld label{display:block;font-size:13px;font-weight:700;color:#334155;margin-bottom:7px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
@media(max-width:640px){.rc-head{padding:20px}.rc-head h1{font-size:20px}.rc-card{padding:18px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="sidebar"></aside>
  <main class="main">
    <div class="player">
      <p style="margin-bottom:14px"><a href="/training" style="color:#0e9f8a;font-weight:600">← Case Center</a></p>
      <div id="stage"></div>
    </div>
  </main>
</div>
<script src="/js/app.js"></script>
<script>
let S = null; // {attemptId, questions, idx, score, max, caseTitle, caseCode}
const stage = document.getElementById('stage');

function renderQ() {
  const q = S.questions[S.idx];
  const pct = Math.round(100 * S.idx / S.questions.length);
  stage.innerHTML = `
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="qcard">
      <div class="qmeta"><span>${esc(S.caseCode)} · Question ${S.idx + 1} of ${S.questions.length}</span><span>Score: <b>${S.score}</b></span></div>
      <h2>${esc(q.prompt)}</h2>
      <div class="pts">${q.points} points</div>
      <div class="hintbox" id="hint">💡 ${esc(q.hint || 'Think about what the payer needs to see.')}</div>
      <div id="opts">${q.options.map((o, i) =>
        `<button class="opt" data-i="${i}"><b>${'ABCD'[i]}.</b> ${esc(o)}</button>`).join('')}</div>
      <div style="margin-top:6px"><button class="btn btn-line btn-sm" id="hintBtn">Show hint 💡</button></div>
      <div class="feedback" id="fb"></div>
      <div id="nextRow" style="margin-top:16px;display:none;text-align:right">
        <button class="btn btn-teal" id="nextBtn">${S.idx + 1 < S.questions.length ? 'Next question →' : 'See results →'}</button>
      </div>
    </div>`;
  document.getElementById('hintBtn').onclick = () => document.getElementById('hint').classList.add('show');
  stage.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(q, +b.dataset.i));
}

async function answer(q, chosen) {
  stage.querySelectorAll('.opt').forEach(b => b.disabled = true);
  try {
    const r = await api(`/api/attempts/${S.attemptId}/answer`,
      { method: 'POST', body: { questionId: q.id, chosen } });
    S.score += r.pointsEarned;
    stage.querySelectorAll('.opt').forEach(b => {
      const i = +b.dataset.i;
      if (i === r.correctIdx) b.classList.add('right');
      else if (i === chosen) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    const fb = document.getElementById('fb');
    fb.className = 'feedback ' + (r.correct ? 'ok' : 'no');
    fb.innerHTML = `<b>${r.correct ? '✓ Correct' : '✗ Not quite'}${r.pointsEarned ? ` · +${r.pointsEarned} pts` : ''}</b>${esc(r.explanation)}`;
    document.getElementById('nextRow').style.display = 'block';
    document.getElementById('nextBtn').onclick = () => {
      S.idx++;
      if (S.idx < S.questions.length) renderQ(); else finish();
    };
  } catch (e) {
    stage.querySelectorAll('.opt').forEach(b => b.disabled = false);
    alert(e.message);
  }
}

async function finish() {
  const r = await api(`/api/attempts/${S.attemptId}/finish`, { method: 'POST' });
  const pct = r.maxScore ? Math.round(100 * r.score / r.maxScore) : 0;
  stage.innerHTML = `
    <div class="qcard score-hero">
      <div class="ring" style="--p:${pct}%">${pct}%</div>
      <h2>Case complete!</h2>
      <p style="color:#5b6b85;margin:8px 0 4px"><b>${r.score} / ${r.maxScore}</b> points · accuracy ${r.accuracy}%</p>
      <p style="color:#5b6b85">Total points: <b>${r.points}</b> · Level: <b>${esc(r.level)}</b></p>
      <div style="margin-top:22px;display:flex;gap:12px;justify-content:center">
        <a class="btn btn-line" href="/training">Case Center</a>
        <button class="btn btn-teal" onclick="location.reload()">Retry case ↻</button>
      </div>
    </div>`;
}


/* ============ GUIDED MODE: REAL-SOFTWARE SINGLE-PAGE FORMS ============ */
let G = null; // {caseId, code, title, difficulty, desc, steps}

/* ---------- shared UI builders ---------- */
function gHeader(meta) {
  return `<div class="rc-head"><div>
    <div class="rc-kicker">${esc(meta.code)} · GUIDED CASE</div>
    <h1>${esc(meta.title)}</h1>
    <p>${esc(meta.desc || '')}</p></div>
    <span class="pill p-${(meta.difficulty || 'beginner').toLowerCase()}">${esc(meta.difficulty || '')}</span></div>`;
}
function gInstr(steps) {
  return `<div class="rc-card"><h3>📋 Case Instructions</h3>
    <ol class="rc-steps">${steps.map((s, i) => `<li><b>${i + 1}.</b> ${esc(s)}</li>`).join('')}</ol></div>`;
}
function gClin(rows) {
  // rows: [[label, value], ...]
  return `<div class="rc-card"><h3>🩺 Clinical Documentation</h3>
    <div class="kv-card">${rows.map(([l, v]) => `<div class="kv"><span>${esc(l)}</span><b>${v}</b></div>`).join('')}</div></div>`;
}
function gSec(n, title, inner, sub) {
  return `<div class="rc-card"><h3><span class="rc-n">${n}</span> ${esc(title)}</h3>
    ${sub ? `<p class="rc-sub">${sub}</p>` : ''}${inner}</div>`;
}
function gFoot(validBtnId, submitBtnId) {
  return `<div class="rc-card rc-foot"><h3>✅ Validate & Submit Case</h3>
    <div class="feedback" id="vfb" style="margin-bottom:12px"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-line" id="${validBtnId}">Validate</button>
      <button class="btn btn-teal" id="${submitBtnId}" disabled>Submit Training Case</button>
    </div>
    <p class="rc-sub" style="margin:10px 0 0">Validation must pass before submission. Your work creates real records in the training workspace.</p></div>`;
}
function vOk(msg) { const f = document.getElementById('vfb'); f.className = 'feedback ok show'; f.innerHTML = `<b>✓ ${esc(msg)}</b>`; }
function vErr(msg) { const f = document.getElementById('vfb'); f.className = 'feedback no show'; f.innerHTML = `<b>✗ ${esc(msg)}</b>`; }
function optSel(id, rows, valKey, labelFn, ph) {
  return `<select class="input" id="${id}"><option value="">${esc(ph || 'Select…')}</option>` +
    rows.map(r => `<option value="${esc(String(r[valKey]))}">${esc(labelFn(r))}</option>`).join('') + `</select>`;
}
function patTile(p) {
  if (!p) return '';
  return `<div class="rc-tile"><div><b>${esc(p.name)}</b> <span class="bdg b-blue">${esc(p.code)}</span></div>
    <div style="font-size:12.5px;color:#64748b">DOB ${esc(p.dob)} · ${esc(p.gender)} · ${esc(p.phone || '')}</div></div>`;
}
/* complete the guided run via existing step APIs (all at once on submit) */
async function gSubmitRun(caseId, payloads) {
  await api('/api/guided/' + caseId + '/start', { method: 'POST' });
  let total = 0;
  for (let i = 0; i < payloads.length; i++) {
    const r = await api(`/api/guided/${caseId}/step/${i}`, { method: 'POST', body: payloads[i] || {} });
    if (r.ok === false) throw new Error(r.msg || 'Step failed');
    total += r.pointsEarned || 0;
  }
  return total;
}
/* rich result screen */
function gResult(o) {
  // o: {code,title,earned,total,rows:[{t,pts,ok,note}],improve:[str]}
  const pct = o.total ? Math.round(100 * o.earned / o.total) : 0;
  const bad = o.rows.filter(r => !r.ok);
  const perf = bad.length === 0 ? ['Excellent Work! 🎉', 'Flawless case — every element correct. You demonstrated strong RCM understanding.']
    : bad.length <= 1 ? ['Great Job! 👏', 'Solid work with one area to polish. Review the flagged item below.']
    : ['Good Attempt 💪', 'Case submitted. Focus on the flagged items to reach mastery.'];
  stage.innerHTML = `
    <p style="margin-bottom:14px"><a href="/training" style="color:#0e9f8a;font-weight:600">← Case Center</a></p>
    <div class="gcard gdone" style="max-width:660px;margin:0 auto">
      <div class="eyebrow2" style="text-align:center">Training Result</div>
      <h2 style="text-align:center;margin:4px 0">${esc(o.code)} — ${esc(o.title)}</h2>
      <div style="display:flex;justify-content:center;margin:18px 0"><div class="ring" style="--p:${pct}%">${pct}%</div></div>
      <div style="text-align:center"><span class="bdg ${pct >= 80 ? 'b-green' : pct >= 60 ? 'b-amber' : 'b-red'}" style="font-size:13px">${o.earned} / ${o.total} pts</span></div>
      <h3 style="text-align:center;margin:16px 0 8px">${perf[0]}</h3>
      <p style="color:#5b6b85;text-align:center;max-width:480px;margin:0 auto">${perf[1]}</p>
      <h4 style="margin:18px 0 10px;text-align:left">Scoring breakdown</h4>
      <div style="text-align:left">${o.rows.map((r, i) => `
        <div class="sr-row"><span class="sr-n">${i + 1}</span><div style="flex:1"><b>${esc(r.t)}</b><br>
        <span style="font-size:12px;color:#64748b">${r.pts} pts${r.note ? ' · ' + esc(r.note) : ''}</span></div>
        ${r.ok ? '<span class="bdg b-green"><span class="dot"></span>Correct</span>' : '<span class="bdg b-red"><span class="dot"></span>Missed</span>'}</div>`).join('')}</div>
      ${o.improve && o.improve.length ? `<div class="imp-box"><h4>📝 Items to improve</h4><ul>${o.improve.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      <div style="margin-top:22px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <a class="btn btn-line" href="/training">← Case Center</a>
        <a class="btn btn-teal" href="/play?case=${G.caseId}">Try quiz mode →</a>
      </div>
    </div>
    <style>.sr-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f1f5f9}
    .sr-n{width:28px;height:28px;border-radius:50%;background:#f1f5f9;color:#475569;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
    .imp-box{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:16px;margin-top:16px;text-align:left}
    .imp-box h4{margin:0 0 10px;color:#92400e}.imp-box ul{margin:0;padding-left:20px;font-size:13.5px;color:#57534e}.imp-box li{margin-bottom:8px}</style>`;
  window.scrollTo({ top: 0 });
}

/* ================= CASE 001 — ELIGIBILITY ================= */
const CASE_META = {
  'CASE-001': { instr: ['Select the patient', 'Select their insurance policy', 'Run the 270/271 eligibility check', 'Review the 271 response', 'Interpret the result and submit'],
       clin: null },
  'CASE-002': { instr: ['Review the clinical documentation', 'Select the primary ICD-10-CM code', 'Select the CPT procedure code', 'Answer the medical-necessity check', 'Document your rationale', 'Validate and submit'],
       clin: [['Patient', 'Established patient, age 45'], ['Encounter', 'Office visit — Type 2 diabetes follow-up + hypertension check'], ['Provider time', '30 minutes, level-3 evaluation'], ['Assessment', 'E11.9 Type 2 diabetes without complications<br>I10 Essential hypertension'], ['Orders', 'A1C lab (CPT 83036)']] },
  'CASE-003': { instr: ['Select the patient', 'Enter the encounter charge (CPT 99213 · ICD E11.9 · $180.00)', 'Create the claim from your charge', 'Answer the clean-claim check', 'Validate and submit'],
       clin: [['Encounter', 'Office visit, established patient'], ['Documented', 'CPT 99213 · ICD-10 E11.9 · $180.00']] },
  'CASE-004': { instr: ['Select a DRAFT claim from your queue', 'Run the 13-rule claim scrubber', 'Review each rule result', 'Answer the fix check', 'Submit the clean claim'],
       clin: null },
  'CASE-005': { instr: ['Select a SUBMITTED claim', 'Review the ERA (835 remittance)', 'Enter payment: paid $120 · adjustment $30 · patient $30', 'Reconcile the balance', 'Post the payment'],
       clin: [['ERA received', '835 remittance advice'], ['Billed', '$180.00'], ['Allowed', '$150.00'], ['Paid', '$120.00'], ['Contractual adjustment', '$30.00'], ['Patient responsibility', '$30.00']] },
  'CASE-006': { instr: ['Select the denial to work', 'Review the claim and denial reason', 'Identify the root cause', 'Choose the corrective action', 'Document the resolution', 'Resolve and submit'],
       clin: [['Remittance shows', 'CO-97 — benefit for this service is included in payment for another procedure']] },
  'CASE-007': { instr: ['Review the A/R aging buckets', 'Prioritize: which bucket first?', 'Select a claim to follow up', 'Log the payer follow-up note', 'Answer the DSO check', 'Submit'],
       clin: [['A/R aging', '0–30 · 31–60 · 61–90 · 90+ days'], ['Priority rule', 'Oldest dollars first — 90+ risks timely-filing write-off']] },
  'CASE-008': { instr: ['Select patient & verify eligibility', 'Enter the charge', 'Create + validate the claim', 'Submit to payer', 'Post the ERA payment', 'Document the full-cycle note', 'Submit'],
       clin: [['Capstone', 'Run the entire revenue cycle end-to-end on real workspace data']] },
  'CASE-009': { instr: ['Review the registration briefing', 'Register the new patient with complete demographics', 'Answer the completeness check', 'Answer the duplicate-record check', 'Validate and submit'],
       clin: [['Walk-in', 'New patient — first visit'], ['Photo ID shows', 'Sarah Mitchell · DOB 03/22/1988'], ['Contact on ID', '(555) 234-5678 · sarah.mitchell@email.com'], ['Address on ID', '123 Oak Street, Springfield, IL 62701']] },
  'CASE-010': { instr: ['Review the insurance briefing', 'Select the patient', 'Select their insurance policy', 'Determine the coverage status', 'Handle inactive coverage', 'Validate and submit'],
       clin: [['Scenario', 'Patient hands you their insurance card at check-in'], ['Card shows', 'Effective 01/01/2026 · $25 copay · referral required for specialist']] },
  'CASE-011': { instr: ['Review the billing briefing', 'Select a READY charge', 'Create the CMS-1500 claim', 'Answer the clean-claim check', 'Validate and submit'],
       clin: [['Source', 'Completed encounter charge (coded and ready)'], ['Output', 'Professional CMS-1500 claim (837P) in DRAFT']] },
  'CASE-012': { instr: ['Review the clearinghouse briefing', 'Select a DRAFT claim', 'Run the 13-rule scrubber', 'Submit the 837P to the payer', 'Read the adjudication result', 'Validate and submit'],
       clin: [['Pre-flight', 'Claim must pass all 13 scrubber rules'], ['Transmission', '837P electronic professional claim']] },
};

async function renderCase001() {
  const m = G.meta, cm = CASE_META['CASE-001'];
  const [pd, id] = await Promise.all([api('/api/rcm/patients'), api('/api/rcm/insurance')]);
  const pats = pd.patients || [], allIns = id.insurance || [];
  stage.innerHTML = `<p style="margin-bottom:14px"><a href="/training" style="color:#0e9f8a;font-weight:600">← Back to Training Center</a></p>
  ${gHeader(m)}${gInstr(cm.instr)}
  ${gSec(1, 'Select the Patient', optSel('c1_pat', pats, 'code', p => `${p.name} — ${p.code}`, 'Choose a patient…'),
    'Choose whose coverage you will verify.')}
  <div id="c1_ptile"></div>
  ${gSec(2, 'Select Their Insurance', `<div id="c1_inswrap"><p class="rc-sub">Select a patient first.</p></div>`,
    'Pick the active policy that will be billed.')}
  ${gSec(3, 'Run the 270/271 Eligibility Check', `
    <button class="btn btn-teal" id="c1_verify" disabled>▶ Run 270 Inquiry</button>
    <div id="c1_271" style="margin-top:14px"></div>`,
    'Send the 270 eligibility inquiry to the payer and read the 271 response.')}
  ${gSec(4, 'Interpret the 271 Response', `
    <p class="rc-sub">Based on the coverage, copay and deductible shown above:</p>
    <div class="quiz-opts" id="c1_opts">
      ${['Collect the $25 copay at check-in; the deductible applies to today\u2019s charges',
         'Bill the patient the full visit amount today',
         'Skip it \u2014 insurance covers everything',
         'Reschedule the patient until the deductible is met'].map((o, i) =>

    if (ans !== 0) return vErr('Adjudication reading is wrong — PAID means adjudicated; always reconcile the ERA.');
    vOk('Claim validated, submitted and adjudicated. Ready to submit the case.');
    document.getElementById('c12_submit').disabled = false;
  };
  document.getElementById('c12_submit').onclick = async () => {
    const btn = document.getElementById('c12_submit'); btn.disabled = true; btn.textContent = 'Submitting…';
    try {
      const earned = await gSubmitRun(G.caseId, [{}, { value: clm.id }, { result: validated }, { result: sent }, { chosen: ans }]);
      gResult({ code: m.code, title: m.title, earned, total: 50,
        rows: [
          { t: 'Clearinghouse briefing', pts: 5, ok: true },
          { t: 'Select a draft claim', pts: 10, ok: true, note: clm.claim_no },
          { t: 'Run the claim scrubber', pts: 15, ok: true, note: validated.validation },
          { t: 'Submit to the payer', pts: 10, ok: true, note: sent.status },
          { t: 'Read the adjudication', pts: 10, ok: true },
        ], improve: [] });
    } catch (e) { vErr(e.message); btn.disabled = false; btn.textContent = 'Submit Training Case'; }
  };
}

/* ---------- boot ---------- */
const CASE_RENDERERS = { 'CASE-001': renderCase001, 'CASE-002': renderCase002, 'CASE-003': renderCase003, 'CASE-004': renderCase004, 'CASE-005': renderCase005, 'CASE-006': renderCase006, 'CASE-007': renderCase007, 'CASE-008': renderCase008, 'CASE-009': renderCase009, 'CASE-010': renderCase010, 'CASE-011': renderCase011, 'CASE-012': renderCase012 };
async function bootGuided(u, caseId) {
  try {
    const g = await api('/api/guided/' + caseId);
    const metaRes = await api('/api/cases/' + caseId).catch(() => ({}));
    G = { caseId, code: g.case.code, title: g.case.title,
          meta: { code: g.case.code, title: g.case.title, difficulty: g.case.difficulty, desc: metaRes.description || '' } };
    if (g.run && g.run.status === 'completed') {
      stage.innerHTML = `<p style="margin-bottom:14px"><a href="/training" style="color:#0e9f8a;font-weight:600">← Back to Training Center</a></p>
        <div class="gcard gdone" style="margin:0 auto"><h2>Already completed</h2>
        <p style="color:#5b6b85">You finished this case with <b>${g.run.points} pts</b>.</p>
        <div style="margin-top:18px;display:flex;gap:12px;justify-content:center">
          <a class="btn btn-line" href="/training">Case Center</a>
          <button class="btn btn-teal" id="grestart">Restart case ↻</button></div></div>`;
      document.getElementById('grestart').onclick = async () => {
        await api('/api/guided/' + caseId + '/start', { method: 'POST' });
        location.reload();
      };
      return;
    }
    const r = CASE_RENDERERS[g.case.code];
    if (!r) { stage.innerHTML = `<div class="empty">Guided case not available.<br><a href="/training">← back</a></div>`; return; }
    stage.innerHTML = `<div class="empty">Loading case…</div>`;
    await r();
  } catch (e) {
    stage.innerHTML = `<div class="empty">${esc(e.message)}<br><a href="/training" style="color:#0e9f8a">← back</a></div>`;
  }
}

(async () => {
  const u = await requireLogin(); if (!u) return;
  shell('training', u);
  if (!guardFeature(u, 'training', 'Case Player')) return;
  const qs = new URLSearchParams(location.search);
  const caseId = qs.get('case');
  if (!caseId) { location.href = '/training'; return; }
  if (qs.get('mode') === 'guided') { await bootGuided(u, caseId); return; }
  stage.innerHTML = `<div class="empty">Loading case…</div>`;
  try {
    const meta = await api('/api/cases/' + caseId);
    const a = await api('/api/attempts', { method: 'POST', body: { caseId: +caseId } });
    S = { attemptId: a.attemptId, questions: a.questions, idx: 0, score: 0,
          caseCode: meta.code, caseTitle: meta.title };
    renderQ();
  } catch (e) {
    stage.innerHTML = `<div class="empty">Could not load case: ${esc(e.message)}<br><a href="/training" style="color:#0e9f8a">← back</a></div>`;
  }
})();
</script>
