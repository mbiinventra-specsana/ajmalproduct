<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coding Sprints — MbiInventra RCM Academy</title>
<link rel="stylesheet" href="/css/app.css">
<style>
.timer{font-size:34px;font-weight:800;color:#0a1628;font-variant-numeric:tabular-nums}
.timer.low{color:#dc2626;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.hud{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.hud .stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:8px 16px;text-align:center}
.hud .stat b{font-size:20px;color:#0a1628;display:block}
.hud .stat span{font-size:10.5px;color:#64748b;text-transform:uppercase;letter-spacing:.06em}
.qcard{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px}
.qcard .stem{font-size:16px;color:#0f1e33;margin-bottom:6px}
.qcard .meta{font-size:12px;color:#64748b;margin-bottom:14px}
.sopt{display:block;width:100%;text-align:left;border:1px solid #e2e8f0;background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:14px;cursor:pointer}
.sopt:hover:not(:disabled){border-color:#14b8a6}
.sopt.right{border-color:#16a34a;background:#dcfce7}
.sopt.wrong{border-color:#ef4444;background:#fee2e2}
.sopt:disabled{cursor:default}
.durbtn{border:2px solid #e2e8f0;background:#fff;border-radius:12px;padding:14px 22px;font-size:15px;font-weight:700;cursor:pointer;color:#0f1e33}
.durbtn.on{border-color:#14b8a6;background:#f0fdfa}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="sidebar"></aside>
  <main class="main cc">
    <div class="cc-head">
      <div><h1>⚡ Coding Sprints</h1><p>Race the clock. Employers hire on <b>accurate cases per hour</b> — train exactly that. Fictional cases only.</p></div>
      <span class="badge-fict" id="best"></span>
    </div>
    <div class="panel-light" style="max-width:860px;margin:0 auto" id="stage"></div>
  </main>
</div>
<script src="/js/app.js"></script>
<script>
let QS = [], idx = 0, correct = 0, timer = null, left = 0, totalSecs = 300, answers = [], locked = false;
const LET = ['A', 'B', 'C', 'D'];
async function refreshBest() {
  const b = await api('/api/labs/bests');
  if (b.bests['quiz-sprint'] != null) document.getElementById('best').textContent = `BEST ${b.bests['quiz-sprint']}%`;
}
function setup() {
  document.getElementById('stage').innerHTML = `
    <h3 style="margin-bottom:6px">Choose your sprint</h3>
    <p style="color:#64748b;font-size:13.5px;margin-bottom:16px">Questions stream from the full bank across all 8 cases. Answer fast — the clock decides your production rate.</p>
    <div style="display:flex;gap:12px;margin-bottom:20px" id="durs">
      <button class="durbtn on" data-s="180">3 min</button>
      <button class="durbtn" data-s="300">5 min</button>
    </div>
    <button class="btn btn-teal" id="go" style="font-size:16px;padding:12px 34px">🏁 Start sprint</button>
    <div style="margin-top:18px;font-size:13px;color:#64748b">Scored like production: <b>accuracy × speed</b>. Your best sprint lives on your record.</div>`;
  let secs = 180;
  document.querySelectorAll('#durs .durbtn').forEach(b => b.onclick = () => {
    document.querySelectorAll('#durs .durbtn').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); secs = +b.dataset.s;
  });
  document.getElementById('go').onclick = () => start(secs);
}
async function start(secs) {
  const d = await api('/api/labs/quiz?mode=mix&n=30');
  if (!d.questions.length) { alert('Question bank is empty.'); return; }
  QS = d.questions; idx = 0; correct = 0; answers = []; left = secs; totalSecs = secs; finished = false;
  tick(); timer = setInterval(tick, 1000);
  renderQ();
}
function tick() {
  left--;
  const t = document.getElementById('clock');
  if (t) {
    const m = String(Math.floor(left / 60)).padStart(2, '0'), s = String(left % 60).padStart(2, '0');
    t.textContent = `${m}:${s}`;
    if (left <= 30) t.classList.add('low');
  }
  if (left <= 0) finish();
}
function hud() {
  return `<div class="hud">
    <div class="timer" id="clock">--:--</div>
    <div style="display:flex;gap:12px">
      <div class="stat"><b>${correct}</b><span>correct</span></div>
      <div class="stat"><b>${idx}</b><span>answered</span></div>
      <div class="stat"><b>${QS.length - idx}</b><span>left</span></div>
    </div></div>`;
}
function renderQ() {
  locked = false;
  if (idx >= QS.length) return finish();
  const q = QS[idx];
  document.getElementById('stage').innerHTML = hud() + `
    <div class="qcard">
      <div class="meta">${esc(q.caseCode)} · Q${q.qnum} · Question ${idx + 1} of ${QS.length}</div>
      <div class="stem">${esc(q.prompt)}</div>
      <div style="margin-top:14px">${q.options.map((o, i) =>
        `<button class="sopt" onclick="answer(${i},this)"><b>${LET[i]}.</b> ${esc(o)}</button>`).join('')}</div>
    </div>`;
}
async function answer(i, el) {
  if (locked) return; locked = true;
  const q = QS[idx];
  const res = await api('/api/labs/quiz/submit', { method: 'POST',
    body: JSON.stringify({ mode: 'sprint', quiet: true, answers: [{ questionId: q.id, chosen: i }] }) });
  const fb = res.feedback[0];
  answers.push({ questionId: q.id, chosen: i });
  if (fb.correct) correct++;
  el.parentElement.querySelectorAll('.sopt').forEach((o, j) => {
    o.disabled = true;
    if (res.feedback[0] && j === i) o.classList.add(fb.correct ? 'right' : 'wrong');
  });
  idx++;
  setTimeout(() => { if (left > 0) renderQ(); }, 750);
}
let finished = false;
async function finish() {
  if (finished) return; finished = true;
  clearInterval(timer); timer = null;
  const acc = idx ? Math.round(100 * correct / idx) : 0;
  const mins = Math.max(0.5, (totalSecs - Math.max(0, left)) / 60);
  if (answers.length) {
    try { await api('/api/labs/quiz/submit', { method: 'POST',
      body: JSON.stringify({ mode: 'sprint', answers }) }); } catch (e) {}
  }
  document.getElementById('stage').innerHTML = `
    <div class="score-banner" style="border-radius:12px;padding:22px;text-align:center;background:#eef2ff;color:#1e3a8a;margin-bottom:16px">
      <b style="font-size:34px">🏁 ${correct}/${idx}</b>
      <div>Accuracy <b>${acc}%</b> · Pace <b>${(idx / mins).toFixed(1)}</b> questions/min</div>
      <div style="font-size:13px;margin-top:6px">${acc >= 80 ? 'Production-ready pace. Employers notice this.' : acc >= 60 ? 'Solid — push accuracy past 80%.' : 'Slow down slightly: accuracy beats raw speed.'}</div>
    </div>
    <button class="btn btn-teal" onclick="setup()">↺ Sprint again</button>`;
  refreshBest();
}
(async () => {
  const u = await currentUser();
  if (!u) { location.href = '/login'; return; }
  if (u.role !== 'student') { location.href = u.role === 'admin' ? '/owner' : '/login'; return; }
  shell('sprints', u);
  setup(); refreshBest();
})();
</script>
</body>
</html>
