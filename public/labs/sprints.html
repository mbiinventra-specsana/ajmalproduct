<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coding Sprints — MbiInventra RCM Academy</title>
<link rel="stylesheet" href="/css/app.css">
<style>
/* ===== Sprints Lab ULTRA ===== */
.lab-hero{background:linear-gradient(120deg,#0f2743,#143a5e 60%,#0e6f62);border-radius:18px;padding:26px 30px;color:#fff;
  margin-bottom:20px;position:relative;overflow:hidden;box-shadow:0 8px 28px rgba(15,39,67,.22)}
.lab-hero::before{content:"";position:absolute;top:-60px;right:8%;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(52,211,189,.25),transparent 70%)}
.lab-hero::after{content:"";position:absolute;bottom:-90px;left:32%;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(52,211,189,.12),transparent 70%)}
.lab-hero h1{margin:0 0 8px;font-size:24px;position:relative;z-index:1}
.lab-hero .psub{color:#b9d4e8;margin:0;font-size:14px;position:relative;z-index:1;max-width:640px;line-height:1.6}
.lab-hero .act-row{position:relative;z-index:1;margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hstat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:11px;
  padding:8px 16px;font-size:13px;backdrop-filter:blur(6px);color:#dbeafe}
.hstat b{font-size:16px;color:#5eead4}
.eyebrow2{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#34d3bd;margin-bottom:8px;position:relative;z-index:1}
@keyframes labIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lab-anim{animation:labIn .45s cubic-bezier(.2,.8,.2,1) backwards}
.timer{font-size:34px;font-weight:800;color:#0a1628;font-variant-numeric:tabular-nums}
.timer.low{color:#dc2626;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.hud{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.hud .stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:8px 16px;text-align:center}
.hud .stat b{font-size:20px;color:#0a1628;display:block}
.hud .stat span{font-size:10.5px;color:#64748b;text-transform:uppercase;letter-spacing:.06em}
.qcard{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px}
.qcard .stem{font-size:16px;color:#0f1e33;margin-bottom:6px}
.qcard .meta{font-size:12px;color:#64748b;margin-bottom:14px}
.sopt{display:block;width:100%;text-align:left;border:1px solid #e2e8f0;background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:14px;cursor:pointer}
.sopt:hover:not(:disabled){border-color:#14b8a6}
.sopt.right{border-color:#16a34a;background:#dcfce7}
.sopt.wrong{border-color:#ef4444;background:#fee2e2}
.sopt:disabled{cursor:default}
.durbtn{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:18px 26px;font-size:16px;font-weight:700;
  cursor:pointer;color:#0f1e33;transition:all .2s;font-family:inherit;min-width:150px}
.durbtn small{display:block;font-size:11.5px;font-weight:600;color:#64748b;margin-top:4px}
.durbtn:hover{border-color:#0e9f8a;transform:translateY(-3px);box-shadow:0 6px 18px rgba(14,159,138,.14)}
.durbtn.on{border-color:#0e9f8a;background:linear-gradient(135deg,#f0fdfa,#ccfbf1);box-shadow:0 0 0 3px rgba(14,159,138,.15)}
.qcard{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(10,22,40,.05)}
.sopt{display:block;width:100%;text-align:left;border:1.5px solid #e2e8f0;background:#fff;border-radius:12px;
  padding:13px 16px;margin-bottom:10px;font-size:14px;cursor:pointer;transition:all .16s;font-family:inherit;color:#0f1e33}
.sopt:hover:not(:disabled){border-color:#0e9f8a;transform:translateX(4px)}
.sopt.right{border-color:#16a34a;background:linear-gradient(135deg,#dcfce7,#bbf7d0)}
.sopt.wrong{border-color:#ef4444;background:linear-gradient(135deg,#fee2e2,#fecaca)}
.hud .stat{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px 18px;text-align:center;box-shadow:0 1px 4px rgba(10,22,40,.05)}
.prog{height:8px;background:#eef2f7;border-radius:6px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#0e9f8a,#34d3bd);border-radius:6px;transition:width .3s}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="sidebar"></aside>
  <main class="main cc">
    <div class="lab-hero lab-anim">
      <div class="eyebrow2">Advanced Labs · Speed Training</div>
      <h1>⚡ Coding Sprints</h1>
      <p class="psub">Race the clock. Employers hire on <b style="color:#5eead4">accurate cases per hour</b> — train exactly that. Speed means nothing without accuracy.</p>
      <div class="act-row">
        <span class="hstat">🏆 Best <b id="best">—</b></span>
        <span class="hstat">⚡ <b>3</b> / <b>5</b> min sprints</span>
        <span class="hstat">🎯 Full question bank</span>
      </div>
    </div>
    <div class="panel-light" style="max-width:860px;margin:0 auto" id="stage"></div>
  </main>
</div>
<script src="/js/app.js"></script>
<script>
let QS = [], idx = 0, correct = 0, timer = null, left = 0, totalSecs = 300, answers = [], locked = false;
const LET = ['A', 'B', 'C', 'D'];
async function refreshBest() {
  const b = await api('/api/labs/bests');
  if (b.bests['quiz-sprint'] != null) document.getElementById('best').textContent = `${b.bests['quiz-sprint']}%`;
}
function setup() {
  document.getElementById('stage').innerHTML = `
    <div class="lab-anim" style="text-align:center;padding:10px 0 6px">
      <div style="font-size:52px;margin-bottom:8px">🏁</div>
      <h3 style="margin:0 0 6px;font-size:20px">Choose your sprint</h3>
      <p style="color:#64748b;font-size:13.5px;margin:0 0 20px">Questions stream from the full bank. Answer fast — the clock decides your production rate.</p>
    </div>
    <div style="display:flex;gap:14px;margin-bottom:24px;justify-content:center;flex-wrap:wrap" id="durs">
      <button class="durbtn on" data-s="180">⚡ 3 min<small>Quick burst</small></button>
      <button class="durbtn" data-s="300">🔥 5 min<small>Endurance run</small></button>
    </div>
    <div style="text-align:center">
      <button class="btn btn-teal" id="go" data-fn="lab-run" style="font-size:17px;padding:14px 44px">🏁 Start sprint</button>
    </div>
    <div style="margin-top:20px;font-size:13px;color:#64748b;text-align:center;background:#f8fafc;border-radius:12px;padding:14px">
      Scored like production: <b>accuracy × speed</b>. Your best sprint lives on your record.</div>`;
  let secs = 180;
  document.querySelectorAll('#durs .durbtn').forEach(b => b.onclick = () => {
    document.querySelectorAll('#durs .durbtn').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); secs = +b.dataset.s;
  });
  document.getElementById('go').onclick = () => start(secs);
}
async function start(secs) {
  const d = await api('/api/labs/quiz?mode=mix&n=30');
  if (!d.questions.length) { alert('Question bank is empty.'); return; }
  QS = d.questions; idx = 0; correct = 0; answers = []; left = secs; totalSecs = secs; finished = false;
  tick(); timer = setInterval(tick, 1000);
  renderQ();
}
function tick() {
  left--;
  const t = document.getElementById('clock');
  if (t) {
    const m = String(Math.floor(left / 60)).padStart(2, '0'), s = String(left % 60).padStart(2, '0');
    t.textContent = `${m}:${s}`;
    if (left <= 30) t.classList.add('low');
  }
  if (left <= 0) finish();
}
function hud() {
  const pct = QS.length ? Math.round(100 * idx / QS.length) : 0;
  const acc = idx ? Math.round(100 * correct / idx) : 100;
  return `<div class="prog"><i style="width:${pct}%"></i></div>
  <div class="hud">
    <div class="timer" id="clock">--:--</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <div class="stat"><b style="color:#16a34a">${correct}</b><span>correct</span></div>
      <div class="stat"><b>${idx}</b><span>answered</span></div>
      <div class="stat"><b>${acc}%</b><span>accuracy</span></div>
    </div></div>`;
}
function renderQ() {
  locked = false;
  if (idx >= QS.length) return finish();
  const q = QS[idx];
  document.getElementById('stage').innerHTML = hud() + `
    <div class="qcard">
      <div class="meta">${esc(q.caseCode)} · Q${q.qnum} · Question ${idx + 1} of ${QS.length}</div>
      <div class="stem">${esc(q.prompt)}</div>
      <div style="margin-top:14px">${q.options.map((o, i) =>
        `<button class="sopt" onclick="answer(${i},this)"><b>${LET[i]}.</b> ${esc(o)}</button>`).join('')}</div>
    </div>`;
}
async function answer(i, el) {
  if (locked) return; locked = true;
  const q = QS[idx];
  const res = await api('/api/labs/quiz/submit', { method: 'POST',
    body: JSON.stringify({ mode: 'sprint', quiet: true, answers: [{ questionId: q.id, chosen: i }] }) });
  const fb = res.feedback[0];
  answers.push({ questionId: q.id, chosen: i });
  if (fb.correct) correct++;
  el.parentElement.querySelectorAll('.sopt').forEach((o, j) => {
    o.disabled = true;
    if (res.feedback[0] && j === i) o.classList.add(fb.correct ? 'right' : 'wrong');
  });
  idx++;
  setTimeout(() => { if (left > 0) renderQ(); }, 750);
}
let finished = false;
async function finish() {
  if (finished) return; finished = true;
  clearInterval(timer); timer = null;
  const acc = idx ? Math.round(100 * correct / idx) : 0;
  const mins = Math.max(0.5, (totalSecs - Math.max(0, left)) / 60);
  if (answers.length) {
    try { await api('/api/labs/quiz/submit', { method: 'POST',
      body: JSON.stringify({ mode: 'sprint', answers }) }); } catch (e) {}
  }
  const medal = acc >= 90 ? '🥇' : acc >= 80 ? '🥈' : acc >= 60 ? '🥉' : '💪';
  document.getElementById('stage').innerHTML = `
    <div class="lab-anim" style="border-radius:18px;padding:30px;text-align:center;margin-bottom:18px;
      background:linear-gradient(135deg,#0f2743,#143a5e);color:#fff;box-shadow:0 10px 30px rgba(15,39,67,.3)">
      <div style="font-size:56px;margin-bottom:6px">${medal}</div>
      <div class="eyebrow2" style="z-index:auto">Sprint Complete</div>
      <b style="font-size:44px">🏁 ${correct}<span style="font-size:22px;color:#94a3b8">/${idx}</span></b>
      <div style="display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap">
        <span class="hstat">🎯 Accuracy <b>${acc}%</b></span>
        <span class="hstat">⚡ Pace <b>${(idx / mins).toFixed(1)}</b>/min</span>
      </div>
      <div style="font-size:14px;margin-top:14px;color:#b9d4e8">${acc >= 90 ? 'Phenomenal! You code like a production pro.' : acc >= 80 ? 'Production-ready pace. Employers notice this.' : acc >= 60 ? 'Solid — push accuracy past 80%.' : 'Slow down slightly: accuracy beats raw speed.'}</div>
    </div>
    <div style="text-align:center"><button class="btn btn-teal" onclick="setup()" style="font-size:16px;padding:12px 36px">↺ Sprint again</button></div>`;
  refreshBest();
}
(async () => {
  const u = await currentUser();
  if (!u) { location.href = '/login'; return; }
  if (u.role !== 'student') { location.href = u.role === 'admin' ? '/owner' : '/login'; return; }
  shell('sprints', u);
  if (!guardFeature(u, 'sprints', 'Coding Sprints')) return;
  setup(); refreshBest();
})();
</script>
</body>
</html>
